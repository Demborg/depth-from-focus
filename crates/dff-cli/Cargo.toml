[package]
name = "dff-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dff"
path = "src/main.rs"

[dependencies]
dff-core = { path = "../dff-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
